<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"><title>Registro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h2 style="text-align:center; background:#eee; padding:15px; margin:0; color:#333;">Registro de Nuevo Material</h2>
    <form id="form-reg" class="grid-form">
        <div class="col">
            <label>Modelo *</label><input type="text" id="modelo" required>
            <label>No. de Parte *</label><input type="text" id="noParte" required>
            <label>Nombre Pieza *</label><input type="text" id="nombre" required>
            <label>Descripción</label><textarea id="descripcion"></textarea>
        </div>
        <div class="col">
            <label>Cantidad *</label><input type="number" id="cantidad" required>
            <label>Costo *</label><input type="number" id="costo" required>
            <label>Lote</label><input type="text" id="lote">
            <label>Estado</label><input type="text" id="estado" placeholder="Nuevo, usado...">
        </div>
        <div class="col">
            <p style="color:#333; font-weight:bold; margin-bottom:10px;">Tipo de Insumo:</p>
            <label style="color:#333;"><input type="checkbox" id="consumible"> Consumible</label><br>
            <label style="color:#333;"><input type="checkbox" id="pieza"> Pieza</label><br>
            <label style="color:#333;"><input type="checkbox" id="herramienta"> Herramienta</label><br>
            <label style="color:#333;"><input type="checkbox" id="equipo"> Equipo</label>
        </div>
        <div class="col">
            <label>Laboratorio</label><input type="text" id="laboratorio">
            <label>Rack</label><input type="text" id="rack">
            <label>Contenedor</label><input type="text" id="contenedor">
            <label>Observaciones</label><textarea id="observaciones"></textarea>
        </div>
        <div class="form-buttons">
            <button type="submit" class="btn-action">Registrar</button>
            <button type="button" class="btn-action" onclick="location.href='index.html'">Volver</button>
        </div>
    </form>
    <script type="module">
        import { db, checkAuth } from './config.js';
        import { collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        checkAuth('registrar');

        document.getElementById('form-reg').onsubmit = async (e) => {
            e.preventDefault();
            await addDoc(collection(db, "productos"), {
                modelo: document.getElementById('modelo').value,
                noParte: document.getElementById('noParte').value,
                nombre: document.getElementById('nombre').value,
                descripcion: document.getElementById('descripcion').value,
                cantidad: Number(document.getElementById('cantidad').value),
                costo: Number(document.getElementById('costo').value),
                lote: document.getElementById('lote').value,
                estado: document.getElementById('estado').value,
                consumible: document.getElementById('consumible').checked ? "X" : "",
                pieza: document.getElementById('pieza').checked ? "X" : "",
                herramienta: document.getElementById('herramienta').checked ? "X" : "",
                equipo: document.getElementById('equipo').checked ? "X" : "",
                laboratorio: document.getElementById('laboratorio').value,
                rack: document.getElementById('rack').value,
                contenedor: document.getElementById('contenedor').value,
                observaciones: document.getElementById('observaciones').value
            });
            alert("Registrado correctamente"); e.target.reset();
        };
    </script>
</body>
</html>
