<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"><title>Página Principal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-blue">
    <header><h1>Página Principal</h1></header>
    <div class="main-container">
        <nav class="side-menu">
            <button onclick="location.href='registro.html'">Registrar</button>
            <button onclick="location.href='actualizar.html'">Actualizar</button>
            <button onclick="location.href='eliminar.html'">Eliminar</button>
            <button id="navAdmin" style="display:none; background:#f1c40f;" onclick="location.href='usuarios.html'">Administrar Usuarios</button>
            <button>Imprimir Código de Barras</button>
        </nav>
        <section class="content">
            <div style="margin-bottom:15px; display:flex; gap:10px;">
                <input type="text" id="mainSearch" placeholder="Buscar por Número de Parte..." style="flex:1; padding:12px;">
                <button class="btn-action" style="background:#27ae60; color:white;">BUSCAR</button>
            </div>
            <div class="table-wrapper">
                <table id="tabla-prod">
                    <thead>
                        <tr>
                            <th>Modelo</th><th>No. Parte</th><th>Nombre</th><th>Descripción</th>
                            <th>Cantidad</th><th>Costo</th><th>Consumible</th><th>Tipo</th>
                            <th>Área</th><th>Estante</th><th>Contenedor</th>
                            <th>Lote</th><th>Presentación</th><th>Observaciones</th>
                        </tr>
                    </thead>
                    <tbody id="inventory-body"></tbody>
                </table>
            </div>
        </section>
    </div>
    <button class="btn-exit" onclick="sessionStorage.clear(); location.href='login.html'">Salir</button>
    <script type="module">
        import { db, checkAuth } from './config.js';
        import { collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        
        const user = checkAuth();
        if(user && user.usuario === 'admin') document.getElementById('navAdmin').style.display = 'block';

        let productos = [];
        onSnapshot(collection(db, "productos"), (snap) => {
            productos = [];
            snap.forEach(doc => { productos.push(doc.data()); });
            render(productos);
        });

        function render(lista) {
            const tbody = document.getElementById('inventory-body');
            tbody.innerHTML = '';
            lista.forEach(p => {
                tbody.innerHTML += `<tr>
                    <td>${p.modelo||''}</td><td style="font-weight:bold;">${p.noParte||''}</td>
                    <td>${p.nombre||''}</td><td>${p.descripcion||''}</td><td>${p.cantidad||0}</td>
                    <td>$${p.costo||0}</td><td>${p.consumible||''}</td><td>${p.tipo||''}</td>
                    <td>${p.ubicacion||''}</td><td>${p.estante||''}</td><td>${p.contenedor||''}</td>
                    <td>${p.lote||''}</td><td>${p.presentacion||''}</td><td>${p.observaciones||''}</td>
                </tr>`;
            });
        }
        document.getElementById('mainSearch').addEventListener('input', (e) => {
            const val = e.target.value.toLowerCase();
            render(productos.filter(p => (p.noParte||'').toLowerCase().includes(val)));
        });
    </script>
</body>
</html>
