<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"><title>Importar JSON Especial - Inventario</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .import-container { max-width: 800px; margin: 20px auto; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .log-box { background: #1e1e1e; color: #00ff00; padding: 15px; height: 350px; overflow-y: auto; font-family: monospace; font-size: 13px; margin-top: 20px; border-radius: 5px; }
        .error-msg { color: #ff5555; }
        .success-msg { color: #55ff55; }
        progress { width: 100%; height: 25px; margin-top: 10px; }
    </style>
</head>
<body class="bg-blue">
    <div class="import-container">
        <h2 style="color:#2c3e50; text-align:center;">Importación Masiva (Formato Excel-JSON)</h2>
        
        <input type="file" id="jsonFile" accept=".json" style="margin: 20px 0;">
        <progress id="importProgress" value="0" max="100"></progress>
        <p id="progressText" style="text-align:center; font-weight:bold;">Selecciona tu archivo JSON</p>
        
        <button id="btnImport" class="btn-action" style="width:100%; background:#27ae60; color:white;">SUBIR DATOS A FIREBASE</button>
        <button onclick="location.href='index.html'" class="btn-action" style="width:100%; margin-top:10px;">VOLVER</button>

        <div class="log-box" id="log">--- ESPERANDO ARCHIVO ---</div>
    </div>

    <script type="module">
        import { db, checkAuth } from './config.js';
        import { collection, addDoc, query, where, getDocs, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        
        checkAuth('registrar');

        const btnImport = document.getElementById('btnImport');
        const fileInput = document.getElementById('jsonFile');
        const logBox = document.getElementById('log');
        const progress = document.getElementById('importProgress');
        const progressText = document.getElementById('progressText');

        function addLog(msg, type = '') {
            const div = document.createElement('div');
            if(type === 'error') div.className = 'error-msg';
            if(type === 'success') div.className = 'success-msg';
            div.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            logBox.appendChild(div);
            logBox.scrollTop = logBox.scrollHeight;
        }

        btnImport.onclick = () => {
            const file = fileInput.files[0];
            if (!file) return alert("Selecciona el archivo");

            const reader = new FileReader();
            reader.onload = async (e) => {
                try {
                    const data = JSON.parse(e.target.result);
                    btnImport.disabled = true;
                    
                    let importados = 0;
                    let duplicados = 0;

                    for (let i = 0; i < data.length; i++) {
                        const item = data[i];
                        
                        // MAPEADO DE TUS CAMPOS "__EMPTY"
                        const noParte = (item["__EMPTY_2"] || "").toString().trim();
                        const modelo = (item["__EMPTY_1"] || "").toString().trim();
                        const nombre = (item["__EMPTY_3"] || "Sin Nombre").toString().replace(/_/g, ' '); // Cambia guiones bajos por espacios
                        const cantidad = Number(item["__EMPTY_8"] || 0);
                        const lab = item["__EMPTY_13"] || "";
                        const rack = item["__EMPTY_14"] || "";
                        const cont = item["__EMPTY_15"] || "";

                        if (!noParte) continue;

                        try {
                            // Validar si ya existe para no repetir
                            const q = query(collection(db, "productos"), where("noParte", "==", noParte));
                            const snap = await getDocs(q);

                            if (snap.empty) {
                                await addDoc(collection(db, "productos"), {
                                    modelo: modelo,
                                    noParte: noParte,
                                    nombre: nombre,
                                    cantidad: cantidad,
                                    costo: 0, // No venía en tu ejemplo
                                    laboratorio: lab,
                                    rack: rack,
                                    contenedor: cont,
                                    fechaCarga: serverTimestamp()
                                });
                                importados++;
                                addLog(`✅ OK: ${noParte}`, "success");
                            } else {
                                duplicados++;
                                addLog(`⚠️ Salto (Duplicado): ${noParte}`);
                            }
                        } catch (err) {
                            addLog(`❌ Error en ${noParte}: ${err.message}`, "error");
                        }

                        // Progreso
                        const p = Math.round(((i + 1) / data.length) * 100);
                        progress.value = p;
                        progressText.textContent = `Procesando: ${p}%`;
                    }

                    addLog(`--- FINALIZADO: ${importados} nuevos, ${duplicados} duplicados ---`);
                    alert("Importación completada");
                    btnImport.disabled = false;

                } catch (err) { alert("Error al procesar JSON"); }
            };
            reader.readAsText(file);
        };
    </script>
</body>
</html>
