<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"><title>Importar Datos - Inventario</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        .import-container { max-width: 800px; margin: 20px auto; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .log-box { background: #222; color: #0f0; padding: 15px; height: 300px; overflow-y: auto; font-family: monospace; font-size: 12px; margin-top: 20px; border-radius: 5px; }
        .error-msg { color: #ff6b6b; }
        .success-msg { color: #51cf66; }
        progress { width: 100%; height: 20px; margin-top: 10px; }
    </style>
</head>
<body class="bg-blue">
    <div class="import-container">
        <h2 style="color:#333; text-align:center;">Masive Import (CSV)</h2>
        <p style="font-size:13px; color:#666;">Selecciona un archivo .csv con las columnas: <br><b>modelo, noParte, nombre, cantidad, costo, laboratorio, rack, contenedor</b></p>
        
        <input type="file" id="csvFile" accept=".csv" style="margin: 20px 0;">
        <progress id="importProgress" value="0" max="100"></progress>
        <p id="progressText" style="text-align:center; font-weight:bold; color:#333;">Esperando archivo...</p>
        
        <button id="btnImport" class="btn-action" style="width:100%; background:#27ae60; color:white;">INICIAR IMPORTACIÓN</button>
        <button onclick="location.href='index.html'" class="btn-action" style="width:100%; margin-top:10px;">VOLVER AL PANEL</button>

        <div class="log-box" id="log">--- LOG DE OPERACIONES ---</div>
    </div>

    <script type="module">
        import { db, checkAuth } from './config.js';
        import { collection, addDoc, query, where, getDocs, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        
        checkAuth('registrar');

        const btnImport = document.getElementById('btnImport');
        const fileInput = document.getElementById('csvFile');
        const logBox = document.getElementById('log');
        const progress = document.getElementById('importProgress');
        const progressText = document.getElementById('progressText');

        function addLog(msg, type = '') {
            const div = document.createElement('div');
            div.className = type === 'error' ? 'error-msg' : (type === 'success' ? 'success-msg' : '');
            div.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            logBox.appendChild(div);
            logBox.scrollTop = logBox.scrollHeight;
        }

        btnImport.onclick = () => {
            const file = fileInput.files[0];
            if (!file) return alert("Selecciona un archivo primero");

            btnImport.disabled = true;
            addLog("Iniciando lectura de archivo...", "info");

            Papa.parse(file, {
                header: true,
                skipEmptyLines: true,
                complete: async (results) => {
                    const data = results.data;
                    let importados = 0;
                    let duplicados = 0;
                    let errores = 0;

                    for (let i = 0; i < data.length; i++) {
                        const row = data[i];
                        const np = row.noParte?.trim();

                        if (!np) {
                            addLog(`Fila ${i+1}: NoParte vacío, saltando.`, "error");
                            errores++;
                            continue;
                        }

                        try {
                            // Validar si ya existe
                            const q = query(collection(db, "productos"), where("noParte", "==", np));
                            const snap = await getDocs(q);

                            if (snap.empty) {
                                await addDoc(collection(db, "productos"), {
                                    modelo: row.modelo || '',
                                    noParte: np,
                                    nombre: row.nombre || 'Sin nombre',
                                    cantidad: Number(row.cantidad) || 0,
                                    costo: Number(row.costo) || 0,
                                    laboratorio: row.laboratorio || '',
                                    rack: row.rack || '',
                                    contenedor: row.contenedor || '',
                                    fechaImport: serverTimestamp()
                                });
                                importados++;
                                addLog(`✅ Importado: ${np}`, "success");
                            } else {
                                duplicados++;
                                addLog(`⚠️ Duplicado: ${np} (Omitido)`, "");
                            }
                        } catch (e) {
                            errores++;
                            addLog(`❌ Error en ${np}: ${e.message}`, "error");
                        }

                        // Actualizar barra
                        const p = Math.round(((i + 1) / data.length) * 100);
                        progress.value = p;
                        progressText.textContent = `Procesando: ${p}%`;
                    }

                    addLog(`--- PROCESO TERMINADO ---`);
                    addLog(`Éxito: ${importados} | Duplicados: ${duplicados} | Errores: ${errores}`);
                    alert("Importación finalizada. Revisa el log.");
                    btnImport.disabled = false;
                }
            });
        };
    </script>
</body>
</html>
