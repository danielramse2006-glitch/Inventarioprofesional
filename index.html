<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - Inventario</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-blue">
    <header><h1>Página Principal</h1></header>
    <div class="main-container">
        <nav class="side-menu">
            <button onclick="location.href='registro.html'">Registrar</button>
            <button onclick="location.href='actualizar.html'">Actualizar</button>
            <button onclick="location.href='eliminar.html'">Eliminar</button>
            <button id="nav-admin" onclick="location.href='usuarios.html'" style="display:none; background:#f1c40f;">Administrar Usuarios</button>
        </nav>
        <section class="content">
            <table>
                <thead>
                    <tr><th>Modelo</th><th>Nombre</th><th>Cantidad</th><th>Ubicación</th></tr>
                </thead>
                <tbody id="inventory-body"></tbody>
            </table>
        </section>
    </div>
    <button class="btn-exit" onclick="sessionStorage.clear(); location.href='login.html'">Salir</button>

    <script type="module">
        import { db, checkAuth } from './config.js';
        import { collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const user = checkAuth();
        if(user === 'admin') document.getElementById('nav-admin').style.display = 'block';

        onSnapshot(collection(db, "productos"), (snap) => {
            const tbody = document.getElementById('inventory-body');
            tbody.innerHTML = '';
            snap.forEach(doc => {
                const p = doc.data();
                tbody.innerHTML += `<tr><td>${p.modelo}</td><td>${p.nombre}</td><td>${p.cantidad}</td><td>${p.ubicacion}</td></tr>`;
            });
        });
    </script>
</body>
</html>
