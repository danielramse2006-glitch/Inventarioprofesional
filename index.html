<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"><title>Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-blue">
    <header><h1>Página Principal</h1></header>
    <div class="main-container">
        <nav class="side-menu">
            <button onclick="location.href='registro.html'">Registrar</button>
            <button onclick="location.href='actualizar.html'">Actualizar</button>
            <button onclick="location.href='eliminar.html'">Eliminar</button>
            <button id="btnAdminOnly" style="display:none; background:#f1c40f;" onclick="location.href='usuarios.html'">Administrar Usuarios</button>
            <button>Imprimir Código de Barras</button>
        </nav>
        <section class="content">
            <div class="table-wrapper">
                <table id="tabla-prod">
                    <thead>
                        <tr><th>Modelo</th><th>Nombre</th><th>Cantidad</th><th>Costo</th><th>Ubicación</th></tr>
                    </thead>
                    <tbody id="inventory-body"></tbody>
                </table>
            </div>
        </section>
    </div>
    <button class="btn-exit" onclick="sessionStorage.clear(); location.href='login.html'">Salir</button>
    <script type="module">
        import { db, checkAuth } from './config.js';
        import { collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        
        const user = checkAuth();
        // SOLO EL ADMIN PUEDE CREAR USUARIOS
        if(user.usuario === 'admin') document.getElementById('btnAdminOnly').style.display = 'block';

        onSnapshot(collection(db, "productos"), (snap) => {
            const tbody = document.getElementById('inventory-body');
            tbody.innerHTML = '';
            snap.forEach(doc => {
                const p = doc.data();
                tbody.innerHTML += `<tr><td>${p.modelo}</td><td>${p.nombre}</td><td>${p.cantidad}</td><td>$${p.costo}</td><td>${p.ubicacion}</td></tr>`;
            });
        });
    </script>
</body>
</html>
