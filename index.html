<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"><title>Inventario Principal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-blue">
    <header><h1>Control de Inventario</h1></header>
    <div class="main-container">
        <nav class="side-menu">
            <button id="navReg" style="display:none;" onclick="location.href='registro.html'">Registrar</button>
            <button id="navAct" style="display:none;" onclick="location.href='actualizar.html'">Actualizar</button>
            <button id="navEli" style="display:none;" onclick="location.href='eliminar.html'">Eliminar</button>
            <button id="navImp" style="display:none;" onclick="location.href='importar.html'">Importar JSON</button>
            <div id="cart-box" class="cart-box" style="display:none; background:white; color:#333; padding:10px; border-radius:5px;">
                <h4 style="margin:0; text-align:center;">VALE DE SALIDA</h4>
                <div id="cart-list"></div>
                <input type="text" id="recep" placeholder="Recibe..." style="width:90%;">
                <button onclick="procesarSalida()" style="width:100%; background:#e67e22; color:white; border:none; padding:8px; margin-top:5px; cursor:pointer;">GENERAR VALE</button>
            </div>
            <button class="btn-logout" onclick="sessionStorage.clear(); location.href='login.html'">Cerrar Sesión</button>
        </nav>
        <section class="content">
            <input type="text" id="mainSearch" placeholder="Buscar por modelo, nombre o no. parte..." style="width:100%; padding:10px; margin-bottom:10px;">
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>+</th><th>Modelo</th><th>No. Parte</th><th>Nombre</th><th>Stock</th><th>Laboratorio</th><th>Rack</th>
                        </tr>
                    </thead>
                    <tbody id="inventory-body"></tbody>
                </table>
            </div>
            <div class="bottom-preview" style="background:white; color:#333; padding:20px; border-radius:10px; margin-top:15px; display:flex; gap:20px;">
                <div style="flex:1; text-align:center;">
                    <img id="main-preview-img" src="imagenes/sin_foto.jpg" style="max-height:250px; border-radius:5px;">
                </div>
                <div style="flex:2;">
                    <h2 id="prod-name-display" style="color:#3498db; border-bottom:2px solid #3498db; margin:0;">Selecciona un material</h2>
                    <div id="prod-detail-display" style="margin-top:10px; line-height:1.6;">
                        Elija una fila de la tabla para ver detalles.
                    </div>
                </div>
            </div>
        </section>
    </div>

    <script type="module">
        import { db, checkAuth } from './config.js';
        import { collection, onSnapshot, doc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        
        const user = checkAuth();
        let productos = [];
        let carrito = [];

        if(user.usuario === 'admin') {
            document.querySelectorAll('.side-menu button').forEach(b => b.style.display = 'block');
            document.getElementById('cart-box').style.display = 'block';
        }

        onSnapshot(collection(db, "productos"), (snap) => {
            productos = [];
            const tbody = document.getElementById('inventory-body');
            tbody.innerHTML = '';
            snap.forEach(d => {
                const item = {...d.data(), id: d.id};
                productos.push(item);
                const tr = document.createElement('tr');
                tr.onclick = () => {
                    document.getElementById('prod-name-display').innerText = item.nombre;
                    document.getElementById('prod-detail-display').innerHTML = `
                        <b>Laboratorio:</b> ${item.laboratorio || '-'} <br>
                        <b>Rack:</b> ${item.rack || '-'} | <b>Contenedor:</b> ${item.contenedor || '-'} <br>
                        <b>Estado:</b> ${item.estado || '-'} <br>
                        <b>Tipos:</b> ${[item.consumible, item.pieza, item.herramienta, item.equipo].filter(x => x === 'X' || x === true).length ? 'Activos' : 'N/A'}
                    `;
                };
                tr.innerHTML = `
                    <td><button onclick="agregar('${item.id}')" style="background:#27ae60; color:white; border:none; cursor:pointer;">+</button></td>
                    <td>${item.modelo}</td>
                    <td style="font-weight:bold;">${item.noParte}</td>
                    <td>${item.nombre}</td>
                    <td style="text-align:center;">${item.cantidad}</td>
                    <td>${item.laboratorio || '-'}</td>
                    <td>${item.rack || '-'}</td>
                `;
                tbody.appendChild(tr);
            });
        });

        window.agregar = (id) => {
            const prod = productos.find(x => x.id === id);
            if(prod.cantidad < 1) return alert("Sin stock");
            carrito.push(prod);
            dibujarCarrito();
        };

        function dibujarCarrito() {
            document.getElementById('cart-list').innerHTML = carrito.map(i => `<div style="font-size:11px;">• ${i.nombre}</div>`).join('');
        }

        window.procesarSalida = async () => {
            if(!document.getElementById('recep').value || carrito.length === 0) return alert("Faltan datos");
            for(let item of carrito) {
                await updateDoc(doc(db, "productos", item.id), { cantidad: increment(-1) });
            }
            alert("Salida procesada. Imprimiendo vale...");
            window.print();
            carrito = []; dibujarCarrito();
        };

        document.getElementById('mainSearch').oninput = (e) => {
            const t = e.target.value.toLowerCase();
            const filtered = productos.filter(p => p.nombre.toLowerCase().includes(t) || p.noParte.toLowerCase().includes(t));
            // (Aquí podrías llamar a una función para refrescar solo el tbody si lo deseas)
        };
    </script>
</body>
</html>
