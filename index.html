<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"><title>Página Principal - Inventario</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-blue">
    <header><h1>Página Principal</h1></header>
    
    <div class="main-container">
        <nav class="side-menu">
            <button onclick="location.href='registro.html'">Registrar</button>
            <button onclick="location.href='actualizar.html'">Actualizar</button>
            <button onclick="location.href='eliminar.html'">Eliminar</button>
            <button id="navAdmin" style="display:none; background:#f1c40f;" onclick="location.href='usuarios.html'">Administrar Usuarios</button>
            <button>Imprimir Código de Barras</button>
        </nav>

        <section class="content">
            <div style="margin-bottom:15px;">
                <input type="text" id="mainSearch" placeholder="Buscar por No. Parte, Modelo o Nombre..." style="width:100%; padding:12px; border-radius:5px; border:1px solid #ccc;">
            </div>

            <div class="table-wrapper">
                <table id="tabla-prod">
                    <thead>
                        <tr>
                            <th>Modelo</th>
                            <th>No. Parte</th>
                            <th>Nombre</th>
                            <th>Descripción</th>
                            <th>Cantidad</th>
                            <th>Costo</th>
                            <th>Consumible</th>
                            <th>Tipo</th>
                            <th>Área</th>
                            <th>Estante</th>
                            <th>Contenedor</th>
                            <th>Lote</th>
                            <th>Presentación</th>
                            <th>Observaciones</th>
                        </tr>
                    </thead>
                    <tbody id="inventory-body"></tbody>
                </table>
            </div>

            <div id="image-preview-container">
                <h3 id="preview-title" style="margin-bottom:15px; color: #555;">Pasa el mouse sobre un producto para ver su imagen</h3>
                <img id="main-preview-img" src="imagenes/sin_foto.jpg" alt="Previsualización">
            </div>
        </section>
    </div>

    <button class="btn-exit" onclick="sessionStorage.clear(); location.href='login.html'">Salir</button>

    <script type="module">
        import { db, checkAuth } from './config.js';
        import { collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        
        const user = checkAuth();
        if(user && user.usuario === 'admin') document.getElementById('navAdmin').style.display = 'block';

        let productos = [];

        // Escuchar Firebase
        onSnapshot(collection(db, "productos"), (snap) => {
            productos = [];
            snap.forEach(doc => { productos.push(doc.data()); });
            renderTable(productos);
        });

        function renderTable(lista) {
            const tbody = document.getElementById('inventory-body');
            tbody.innerHTML = '';
            
            lista.forEach(p => {
                const tr = document.createElement('tr');

                // LÓGICA DE IMAGEN POR NOMBRE AL PASAR EL MOUSE (Hover)
                tr.onmouseenter = () => {
                    const nombreParaFoto = (p.nombre || "sin_nombre").trim();
                    const imgPreview = document.getElementById('main-preview-img');
                    const titlePreview = document.getElementById('preview-title');
                    
                    // Busca la imagen basada en el NOMBRE (ej: Esp 32.jpg)
                    imgPreview.src = `imagenes/${nombreParaFoto}.jpg`;
                    titlePreview.innerText = `Producto: ${nombreParaFoto}`;
                    
                    // Si no existe, pone la imagen por defecto
                    imgPreview.onerror = () => { 
                        imgPreview.src = 'imagenes/sin_foto.jpg'; 
                    };
                };

                tr.innerHTML = `
                    <td>${p.modelo || '-'}</td>
                    <td style="font-weight:bold; color:#0056b3;">${p.noParte || '-'}</td>
                    <td>${p.nombre || '-'}</td>
                    <td>${p.descripcion || '-'}</td>
                    <td>${p.cantidad || 0}</td>
                    <td>$${p.costo || 0}</td>
                    <td>${p.consumible || '-'}</td>
                    <td>${p.tipo || '-'}</td>
                    <td>${p.ubicacion || '-'}</td>
                    <td>${p.estante || '-'}</td>
                    <td>${p.contenedor || '-'}</td>
                    <td>${p.lote || '-'}</td>
                    <td>${p.presentacion || '-'}</td>
                    <td>${p.observaciones || '-'}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Buscador
        document.getElementById('mainSearch').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const filtrados = productos.filter(p => 
                (p.noParte || '').toLowerCase().includes(term) ||
                (p.modelo || '').toLowerCase().includes(term) ||
                (p.nombre || '').toLowerCase().includes(term)
            );
            renderTable(filtrados);
        });
    </script>
</body>
</html>
