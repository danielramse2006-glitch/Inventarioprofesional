<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"><title>Actualizar</title>
    <link rel="stylesheet" href="style.css">
    <style>body { background-color: #cccccc; }</style>
</head>
<body>
    <h2 style="text-align:center; background:#999; color:white; padding:15px; margin:0;">Actualizar Material</h2>
    <form id="f-upd" class="grid-form">
        <div class="col">
            <label>Modelo</label><input type="text" id="m">
            <label>No. Parte</label><input type="text" id="np">
            <label>Nombre</label><input type="text" id="n">
        </div>
        <div class="col">
            <label>Cantidad</label><input type="number" id="c">
            <label>Costo</label><input type="number" id="co">
            <label>Estado</label><input type="text" id="est">
        </div>
        <div class="col">
            <label>Laboratorio</label><input type="text" id="lab">
            <label>Rack</label><input type="text" id="rac">
            <label>Contenedor</label><input type="text" id="cnt">
        </div>
        <div class="form-buttons">
            <input type="text" id="val" placeholder="No. de Parte para buscar...">
            <button type="button" id="btnBus" class="btn-action">Buscar</button>
            <button type="submit" class="btn-action">Actualizar</button>
            <button type="button" class="btn-action" onclick="location.href='index.html'">Volver</button>
        </div>
    </form>
    <script type="module">
        import { db, checkAuth } from './config.js';
        import { collection, query, where, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        checkAuth('actualizar');
        let currentId = null;

        document.getElementById('btnBus').onclick = async () => {
            const val = document.getElementById('val').value.trim();
            const q = query(collection(db, "productos"), where("noParte", "==", val));
            const snap = await getDocs(q);
            if(!snap.empty) {
                const d = snap.docs[0].data(); currentId = snap.docs[0].id;
                document.getElementById('m').value = d.modelo;
                document.getElementById('np').value = d.noParte;
                document.getElementById('n').value = d.nombre;
                document.getElementById('c').value = d.cantidad;
                document.getElementById('co').value = d.costo;
                document.getElementById('est').value = d.estado || '';
                document.getElementById('lab').value = d.laboratorio || '';
                document.getElementById('rac').value = d.rack || '';
                document.getElementById('cnt').value = d.contenedor || '';
                alert("Material cargado");
            } else alert("No encontrado");
        };

        document.getElementById('f-upd').onsubmit = async (e) => {
            e.preventDefault();
            if(!currentId) return alert("Busca un material primero");
            await updateDoc(doc(db, "productos", currentId), {
                modelo: document.getElementById('m').value,
                noParte: document.getElementById('np').value,
                nombre: document.getElementById('n').value,
                cantidad: Number(document.getElementById('c').value),
                costo: Number(document.getElementById('co').value),
                estado: document.getElementById('est').value,
                laboratorio: document.getElementById('lab').value,
                rack: document.getElementById('rac').value,
                contenedor: document.getElementById('cnt').value
            });
            alert("Actualizado correctamente");
        };
    </script>
</body>
</html>
