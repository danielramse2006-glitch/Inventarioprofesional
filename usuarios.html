<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"><title>Usuarios</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h2 style="text-align:center;">Crear Perfil de Usuario</h2>
    <div class="grid-form" style="display:flex; flex-direction:column; width:400px; margin:auto;">
        <input type="text" id="u" placeholder="Usuario nuevo">
        <input type="password" id="p" placeholder="Contraseña">
        <div style="margin-top:10px;">
            <label><input type="checkbox" id="pr"> Registrar</label>
            <label><input type="checkbox" id="pa"> Actualizar</label>
            <label><input type="checkbox" id="pd"> Eliminar</label>
        </div>
        <button id="btnSave" class="btn-action" style="margin-top:20px;">Crear Usuario</button>
        <button onclick="location.href='index.html'" class="btn-action" style="margin-top:10px;">Volver</button>
    </div>
    <script type="module">
        import { db, checkAuth } from './config.js';
        import { collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        const user = checkAuth();
        if(user.usuario !== 'admin') window.location.href="index.html";

        document.getElementById('btnSave').onclick = async () => {
            const u = document.getElementById('u').value;
            const p = document.getElementById('p').value;
            if(!u || !p) return alert("Llena los campos");
            await addDoc(collection(db, "usuarios"), {
                usuario: u, password: p,
                permisos: {
                    registrar: document.getElementById('pr').checked,
                    actualizar: document.getElementById('pa').checked,
                    eliminar: document.getElementById('pd').checked
                }
            });
            alert("Usuario Creado"); location.reload();
        };
    </script>
</body>
</html>
