<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"><title>Administración</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h2>Crear Nuevo Perfil (Solo Admin)</h2>
    <div class="grid-form" style="grid-template-columns: 1fr; width: 400px; margin: auto;">
        <input type="text" id="nu" placeholder="Usuario">
        <input type="password" id="np" placeholder="Contraseña">
        <div class="checkbox-group">
            <label><input type="checkbox" id="p_reg"> Registrar</label>
            <label><input type="checkbox" id="p_act"> Actualizar</label>
            <label><input type="checkbox" id="p_del"> Eliminar</label>
        </div>
        <button id="btnSave" class="btn-action">Guardar Usuario</button>
        <button onclick="location.href='index.html'">Volver</button>
    </div>
    <script type="module">
        import { db, checkAuth } from './config.js';
        import { collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        
        const user = checkAuth();
        if(user.usuario !== 'admin') window.location.href="index.html";

        document.getElementById('btnSave').onclick = async () => {
            await addDoc(collection(db, "usuarios"), {
                usuario: document.getElementById('nu').value,
                password: document.getElementById('np').value,
                permisos: {
                    registrar: document.getElementById('p_reg').checked,
                    actualizar: document.getElementById('p_act').checked,
                    eliminar: document.getElementById('p_del').checked
                }
            });
            alert("Usuario creado con éxito");
            location.reload();
        };
    </script>
</body>
</html>
